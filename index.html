<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaokelista</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { text-align: center; margin-bottom: 20px; font-size: 24px; color: #111; }
        .search { width: 100%; padding: 12px; margin-bottom: 20px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #fafafa; cursor: pointer; font-weight: 600; }
        
        /* Stilar för felmeddelanden */
        .error-box { display: none; background-color: #ffeef0; border: 1px solid #ffccd3; color: #d9383a; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; line-height: 1.5; }
        .error-box code { background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .no-result { display: none; text-align: center; padding: 20px; color: #666; }
    </style>
</head>
<body>

<div class="container" id="karaoke-box">
    <h1>🎤 Karaokelistan</h1>
    
    <!-- Den här rutan visar felet om något kraschar -->
    <div id="error-message" class="error-box"></div>
    
    <input id="search-field" class="search" placeholder="Sök på artist eller låttitel..." />

    <table>
        <thead>
            <tr>
                <th class="sort" data-sort="title">Låttitel</th>
                <th class="sort" data-sort="artist">Artist</th>
            </tr>
        </thead>
        <tbody class="list" id="table-body">
            <!-- Låtarna byggs upp här -->
        </tbody>
    </table>
    
    <div class="no-result" id="empty-message">Inga låtar matchar din sökning.</div>
</div>

<script>
    const errorBox = document.getElementById('error-message');

    function showError(title, details) {
        errorBox.style.display = 'block';
        errorBox.innerHTML = `<strong>${title}</strong><br>${details}`;
    }

    // 1. Initiera List.js
    var karaokeList;
    try {
        karaokeList = new List('karaoke-box', {
            valueNames: ['title', 'artist']
        });
    } catch(e) {
        showError("Fel vid start av sökfunktionen:", e.message);
    }

    // 2. Hämta datan
    fetch('songs.json')
        .then(response => {
            if (!response.ok) {
                throw new Error(`Webbplatsen hittade inte filen <code>songs.json</code> (Status: ${response.status}). Kontrollera att filen ligger i samma mapp på GitHub och heter exakt så med små bokstäver.`);
            }
            return response.json();
        })
        .then(data => {
            if (!Array.isArray(data)) {
                throw new Error("Formatet inuti <code>songs.json</code> är felaktigt. Den måste börja med <code>[</code> och sluta med <code>]</code>.");
            }

            const tableBody = document.getElementById('table-body');
            
            data.forEach((song, index) => {
                let rawTitle = song.title || song.Title || song.Låttitel || song.låttitel || song.Låt || "";
                let rawArtist = song.artist || song.Artist || song.Grupp || "";

                const row = document.createElement('tr');
                row.innerHTML = `<td class="title">${rawTitle}</td><td class="artist">${rawArtist}</td>`;
                tableBody.appendChild(row);

                karaokeList.add({ title: rawTitle, artist: rawArtist });
            });

            karaokeList.sort('title', { order: 'asc' });
        })
        .catch(error => {
            // Om JSON-koden är trasig hamnar vi här
            if (error.message.includes("JSON.parse") || error.message.includes("is not valid JSON") || error.name === "SyntaxError") {
                showError("Fel i din songs.json-fil!", "Det finns ett teckenfel i din JSON-kod (oftast ett kommatecken för mycket, för lite, eller smarta citattecken från t.ex. Word). <br><br>Sök på Google efter <strong>JSONLint</strong> och klistra in din text där för att hitta raden som är trasig.");
            } else {
                showError("Ett fel uppstod:", error.message);
            }
        });

    // Sökkoppling
    document.getElementById('search-field').addEventListener('input', function(e) {
        if(karaokeList) karaokeList.search(e.target.value);
    });

    if(karaokeList) {
        karaokeList.on('updated', function(list) {
            const emptyMessage = document.getElementById('empty-message');
            emptyMessage.style.display = list.matchingItems.length === 0 ? 'block' : 'none';
        });
    }
</script>

</body>
</html>
