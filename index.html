<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaokelista</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { text-align: center; margin-bottom: 20px; font-size: 24px; color: #111; }
        .search { width: 100%; padding: 12px; margin-bottom: 20px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.2s; }
        .search:focus { border-color: #007aff; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #fafafa; cursor: pointer; font-weight: 600; user-select: none; }
        .error-box { display: none; background-color: #ffeef0; border: 1px solid #ffccd3; color: #d9383a; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        .no-result { display: none; text-align: center; padding: 20px; color: #666; }
    </style>
</head>
<body>

<div class="container" id="karaoke-box">
    <h1>🎤 Karaokelistan</h1>
    
    <div id="error-message" class="error-box"></div>
    
    <input class="search" placeholder="Sök på artist eller låttitel..." />

    <table>
        <thead>
            <tr>
                <th class="sort" data-sort="title">Låttitel</th>
                <th class="sort" data-sort="artist">Artist</th>
            </tr>
        </thead>
        <tbody class="list" id="table-body">
            <!-- Låtarna byggs upp här INNAN sökfunktionen startar -->
        </tbody>
    </table>
    
    <div class="no-result" id="empty-message">Inga låtar matchar din sökning.</div>
</div>

<script>
    const errorBox = document.getElementById('error-message');
    function showError(title, details) {
        errorBox.style.display = 'block';
        errorBox.innerHTML = `<strong>${title}</strong><br>${details}`;
    }

    // 1. Hämta datan först från songs.json
    fetch('songs.json')
        .then(response => {
            if (!response.ok) {
                throw new Error(`Kunde inte hitta <code>songs.json</code>. Kontrollera filnamnet.`);
            }
            return response.json();
        })
        .then(data => {
            const tableBody = document.getElementById('table-body');
            
            // 2. Skapa vanliga HTML-rader i tabellen för varje låt
            data.forEach(song => {
                let rawTitle = song.title || song.Title || song.Låttitel || song.låttitel || song.Låt || "";
                let rawArtist = song.artist || song.Artist || song.Grupp || "";

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="title">${rawTitle}</td>
                    <td class="artist">${rawArtist}</td>
                `;
                tableBody.appendChild(row);
            });

            // 3. Starta List.js FÖRST NU när alla rader faktiskt finns i tabellen
            var karaokeList = new List('karaoke-box', {
                valueNames: ['title', 'artist']
            });

            // Sortera listan alfabetiskt efter låttitel som standard
            karaokeList.sort('title', { order: 'asc' });

            // Visa meddelande om sökningen blir tom
            karaokeList.on('updated', function(list) {
                const emptyMessage = document.getElementById('empty-message');
                if (list.matchingItems.length === 0) {
                    emptyMessage.style.display = 'block';
                } else {
                    emptyMessage.style.display = 'none';
                }
            });
        })
        .catch(error => {
            if (error.name === "SyntaxError") {
                showError("Fel i din songs.json-fil!", "Det finns ett teckenfel i din JSON-kod. Kontrollera kommatecken och citattecken.");
            } else {
                showError("Ett fel uppstod:", error.message);
            }
        });
</script>

</body>
</html>
